<div class="bg-surface-50 py-16 min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-md px-4">
    <div class="bg-white p-8 sm:p-10 rounded-3xl border border-surface-200 shadow-xl flex flex-col gap-6">
      
      <!-- Header -->
      <div class="text-center flex flex-col items-center gap-2">
        <div class="w-12 h-12 rounded-2xl gradient-primary flex items-center justify-center text-white text-xl shadow-md">
          <i class="pi pi-user-plus"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-surface-900 font-display">
          Create an Account
        </h1>
        <p class="text-xs text-surface-500">
          Join e-rezvonBD for order tracking and exclusive discounts.
        </p>
      </div>

      <!-- Register Form -->
      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()" class="flex flex-col gap-4">
        
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-surface-700">Full Name *</label>
          <input 
            type="text" 
            pInputText 
            formControlName="name" 
            placeholder="John Doe" 
            class="w-full text-xs p-3 rounded-xl"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-surface-700">Phone Number *</label>
          <input 
            type="text" 
            pInputText 
            formControlName="phone" 
            placeholder="017XXXXXXXX" 
            class="w-full text-xs p-3 rounded-xl"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-surface-700">Email Address *</label>
          <input 
            type="email" 
            pInputText 
            formControlName="email" 
            placeholder="name@example.com" 
            class="w-full text-xs p-3 rounded-xl"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-surface-700">Password *</label>
          <input 
            type="password" 
            pInputText 
            formControlName="password" 
            placeholder="Minimum 6 characters" 
            class="w-full text-xs p-3 rounded-xl"
          />
        </div>

        <button 
          type="submit" 
          [disabled]="loading()"
          class="w-full py-3.5 rounded-xl gradient-primary text-white font-bold text-sm shadow-md shadow-primary-600/30 hover:opacity-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50 mt-2"
        >
          @if (loading()) {
            <i class="pi pi-spin pi-spinner"></i> Creating Account...
          } @else {
            <i class="pi pi-check"></i> Register Account
          }
        </button>
      </form>

      <!-- Footer link to login -->
      <div class="text-center text-xs text-surface-500 pt-2 border-t border-surface-100">
        Already have an account? 
        <a routerLink="/auth/login" class="font-bold text-primary-600 hover:text-primary-800">
          Sign In
        </a>
      </div>

    </div>
  </div>
</div>
