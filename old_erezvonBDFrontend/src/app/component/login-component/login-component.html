<div class="bg-surface-50 py-16 min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-md px-4">
    <div class="bg-white p-8 sm:p-10 rounded-3xl border border-surface-200 shadow-xl flex flex-col gap-6">
      
      <!-- Header -->
      <div class="text-center flex flex-col items-center gap-2">
        <div class="w-12 h-12 rounded-2xl gradient-primary flex items-center justify-center text-white text-xl shadow-md">
          <i class="pi pi-user"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-surface-900 font-display">
          {{ isOtpMode() ? 'Sign in with OTP' : 'Welcome Back' }}
        </h1>
        <p class="text-xs text-surface-500">
          Enter your details to access your account & orders.
        </p>
      </div>

      <!-- Toggle Mode Tabs -->
      <div class="grid grid-cols-2 p-1 bg-surface-100 rounded-xl text-xs font-bold text-center">
        <button 
          (click)="isOtpMode.set(false)" 
          [class.bg-white]="!isOtpMode()"
          [class.shadow-2xs]="!isOtpMode()"
          [class.text-primary-700]="!isOtpMode()"
          class="py-2 rounded-lg text-surface-600 transition-all"
        >
          Password Login
        </button>
        <button 
          (click)="isOtpMode.set(true)" 
          [class.bg-white]="isOtpMode()"
          [class.shadow-2xs]="isOtpMode()"
          [class.text-primary-700]="isOtpMode()"
          class="py-2 rounded-lg text-surface-600 transition-all"
        >
          Phone OTP
        </button>
      </div>

      @if (!isOtpMode()) {
        <!-- Password Form -->
        <form [formGroup]="loginForm" (ngSubmit)="submitPasswordLogin()" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-bold text-surface-700">Phone or Email</label>
            <input 
              type="text" 
              pInputText 
              formControlName="identifier" 
              placeholder="017XXXXXXXX or email@domain.com" 
              class="w-full text-xs p-3 rounded-xl"
            />
          </div>

          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center">
              <label class="text-xs font-bold text-surface-700">Password</label>
              <button 
                type="button" 
                (click)="forgotDialogVisible.set(true)" 
                class="text-[11px] font-bold text-primary-600 hover:text-primary-800"
              >
                Forgot?
              </button>
            </div>
            <input 
              type="password" 
              pInputText 
              formControlName="password" 
              placeholder="••••••••" 
              class="w-full text-xs p-3 rounded-xl"
            />
          </div>

          <button 
            type="submit" 
            [disabled]="loading()"
            class="w-full py-3.5 rounded-xl gradient-primary text-white font-bold text-sm shadow-md shadow-primary-600/30 hover:opacity-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50 mt-2"
          >
            @if (loading()) {
              <i class="pi pi-spin pi-spinner"></i> Signing in...
            } @else {
              <i class="pi pi-sign-in"></i> Sign In
            }
          </button>
        </form>
      } @else {
        <!-- OTP Form -->
        <form [formGroup]="otpForm" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-bold text-surface-700">Phone Number</label>
            <input 
              type="text" 
              pInputText 
              formControlName="phone" 
              placeholder="017XXXXXXXX" 
              class="w-full text-xs p-3 rounded-xl"
            />
          </div>

          @if (!otpSent()) {
            <button 
              type="button" 
              (click)="sendOtp()" 
              [disabled]="loading()"
              class="w-full py-3.5 rounded-xl bg-surface-900 hover:bg-black text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-2"
            >
              <i class="pi pi-send"></i> Send Verification OTP
            </button>
          } @else {
            <div class="flex flex-col gap-1 animate-fadein">
              <label class="text-xs font-bold text-surface-700">Enter 6-Digit OTP</label>
              <input 
                type="text" 
                pInputText 
                formControlName="otp" 
                placeholder="123456" 
                class="w-full text-xs p-3 rounded-xl text-center font-mono font-bold tracking-widest text-lg"
              />
            </div>

            <button 
              type="button" 
              (click)="verifyOtp()" 
              [disabled]="loading()"
              class="w-full py-3.5 rounded-xl gradient-primary text-white font-bold text-sm shadow-md shadow-primary-600/30 transition-all flex items-center justify-center gap-2"
            >
              <i class="pi pi-check-circle"></i> Verify & Login
            </button>
          }
        </form>
      }

      <!-- Footer link to register -->
      <div class="text-center text-xs text-surface-500 pt-2 border-t border-surface-100">
        Don't have an account yet? 
        <a routerLink="/auth/register" class="font-bold text-primary-600 hover:text-primary-800">
          Create Account
        </a>
      </div>

    </div>
  </div>
</div>

<!-- Forgot Password Dialog -->
<p-dialog 
  [visible]="forgotDialogVisible()" 
  (visibleChange)="forgotDialogVisible.set($event)"
  header="Reset Your Password" 
  [modal]="true" 
  [style]="{ width: '420px', maxWidth: '95vw' }"
>
  <form [formGroup]="forgotForm" (ngSubmit)="sendForgotPassword()" class="flex flex-col gap-4 py-2 text-xs">
    <p class="text-surface-600">
      Enter your registered email or phone number to receive a password reset link.
    </p>
    <div class="flex flex-col gap-1">
      <label class="font-bold text-surface-700">Email or Phone</label>
      <input type="text" pInputText formControlName="identifier" placeholder="your@email.com or 017..." class="p-3 text-xs rounded-xl" />
    </div>
    <button type="submit" class="py-2.5 rounded-xl gradient-primary text-white font-bold text-xs shadow-md">
      Send Reset Link
    </button>
  </form>
</p-dialog>
